<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">PainQ — Night City</title>
  <desc id="desc">A cyberpunk-inspired neon city at night, with animated rain, glowing signs, and a flying vehicle.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#05070c"/></linearGradient>
    <linearGradient id="road" x2="0" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#030407"/></linearGradient>
    <linearGradient id="haze"><stop stop-color="#fcee0a" stop-opacity="0"/><stop offset=".5" stop-color="#00e5ff" stop-opacity=".16"/><stop offset="1" stop-color="#fcee0a" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="13"/></filter>
    <pattern id="windows" width="24" height="27" patternUnits="userSpaceOnUse"><rect x="5" y="5" width="7" height="10" fill="#00e5ff" opacity=".42"/><rect x="16" y="5" width="4" height="10" fill="#fcee0a" opacity=".38"/></pattern>
  </defs>

  <rect width="1200" height="390" fill="url(#sky)"/>
  <circle cx="930" cy="78" r="70" fill="#fcee0a" opacity=".08" filter="url(#soft)"/>
  <circle cx="930" cy="78" r="30" fill="none" stroke="#fcee0a" stroke-opacity=".35"/>
  <path d="M0 282V170h72v-48h82v120h50V160h75v122h60V105h95v177h55V175h82v107h55V132h94v150h55V177h76v105h56V115h92v167h55V170h78v112h54v108H0Z" fill="#101a29" stroke="#26384d" stroke-width="2"/>
  <path d="M0 282V170h72v-48h82v120h50V160h75v122h60V105h95v177h55V175h82v107h55V132h94v150h55V177h76v105h56V115h92v167h55V170h78v112h54v108H0Z" fill="url(#windows)" opacity=".7"/>
  <g fill="#070b12" stroke="#26384d" stroke-width="2">
    <path d="M25 390V220h105v170M170 390V260h95v130M295 390V185h88v205M410 390V235h110v155M550 390V160h95v230M675 390V230h105v160M810 390V190h100v200M940 390V250h90v140M1060 390V205h110v185"/>
  </g>
  <g fill="url(#windows)" opacity=".8">
    <path d="M25 220h105v170H25zM170 260h95v130h-95zM295 185h88v205h-88zM410 235h110v155H410zM550 160h95v230h-95zM675 230h105v160H675zM810 190h100v200H810zM940 250h90v140h-90zM1060 205h110v185h-110z"/>
  </g>

  <g filter="url(#glow)" font-family="monospace" font-weight="bold" text-anchor="middle">
    <rect x="300" y="206" width="78" height="64" rx="2" fill="#08111a" stroke="#00e5ff" stroke-width="2"/>
    <text x="339" y="231" fill="#00e5ff" font-size="13">NIGHT</text><text x="339" y="249" fill="#00e5ff" font-size="13">CITY</text>
    <rect x="840" y="151" width="98" height="55" fill="#080d15" stroke="#fcee0a" stroke-width="2"/>
    <text x="889" y="185" fill="#fcee0a" font-size="19">2077</text>
  </g>

  <path d="M0 310H1200V390H0Z" fill="url(#road)"/>
  <path d="M0 316H1200" stroke="#00e5ff" stroke-opacity=".35"/>
  <path d="M460 390l90-74h100l90 74" fill="none" stroke="#fcee0a" stroke-opacity=".28" stroke-width="2"/>
  <path d="M0 346h1200" stroke="#26384d" stroke-width="2"/>
  <path d="M500 380h90m30 0h90m30 0h90" stroke="#fcee0a" stroke-width="3" stroke-linecap="round" opacity=".7"/>

  <!-- Flying vehicle -->
  <g>
    <path d="M-150 120h76l25 12h-115z" fill="#101a29" stroke="#00e5ff" stroke-width="2" filter="url(#glow)"/>
    <path d="M-130 120l16-15h32l17 15" fill="#17263a" stroke="#fcee0a" stroke-width="2"/>
    <path d="M-160 134h30m65 0h28" stroke="#ff3158" stroke-width="3"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="1500 55" dur="18s" repeatCount="indefinite"/>
  </g>

  <!-- Rain streaks -->
  <g stroke="#8cecff" stroke-width="1.2" opacity=".32">
    <path d="M80 -30l-28 72M190 -10l-28 72M320 -35l-28 72M450 -5l-28 72M590 -35l-28 72M730 -10l-28 72M870 -35l-28 72M1010 -5l-28 72M1140 -35l-28 72">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 100" dur="1.1s" repeatCount="indefinite"/>
    </path>
    <path d="M140 80l-28 72M270 100l-28 72M400 75l-28 72M540 110l-28 72M680 80l-28 72M820 105l-28 72M960 75l-28 72M1100 105l-28 72">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 120" dur="1.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Atmospheric neon flicker -->
  <rect x="0" y="290" width="1200" height="28" fill="url(#haze)" filter="url(#soft)">
    <animate attributeName="opacity" values=".35;.8;.35" dur="4s" repeatCount="indefinite"/>
  </rect>
  <g font-family="monospace">
    <text x="54" y="65" fill="#fcee0a" font-size="13" letter-spacing="4">PAINQ CITY // SERK TOV AH POY</text>
    <text x="50" y="151" fill="#f4f6fb" font-family="Arial,sans-serif" font-size="66" font-weight="900" letter-spacing="2">PAINQ</text>
    <text x="54" y="180" fill="#00e5ff" font-size="14" letter-spacing="3">SOFTWARE DEVELOPMENT · POY POY GAMING</text>
    <path d="M52 198h360" stroke="#fcee0a" stroke-width="2"/>
    <text x="54" y="224" fill="#b6c4d8" font-size="12" letter-spacing="1">WISH WE COULD GO TO THE MOON TOGETHER.</text>
    <text x="1145" y="366" fill="#fcee0a" font-size="10" text-anchor="end">2077 // PAINQISGOD SYSTEME</text>
  </g>
</svg>
